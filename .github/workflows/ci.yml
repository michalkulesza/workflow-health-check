name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_DB: workflow_spike
          POSTGRES_PASSWORD: workflow
          POSTGRES_USER: workflow
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ORIGIN: http://127.0.0.1:3100
      DATABASE_URL: postgresql://workflow:workflow@localhost:5432/workflow_spike
      PAYLOAD_SECRET: ci-only-secret-that-is-at-least-32-characters
      REPORT_TOKEN_PEPPER: ci-report-token-pepper
      RUN_INTEGRATION_TESTS: 'true'
      E2E_LOCAL_PREVIEW: 'true'
      E2E_QUESTIONNAIRE_ID: 5dc13945-9cb8-4e6b-b504-187c885e0e34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
