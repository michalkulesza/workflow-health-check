name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_DB: workflow_spike
          POSTGRES_PASSWORD: workflow
          POSTGRES_USER: workflow
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://workflow:workflow@localhost:5432/workflow_spike
      PAYLOAD_SECRET: ci-only-secret-that-is-at-least-32-characters
      REPORT_TOKEN_PEPPER: ci-report-token-pepper
      RUN_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
