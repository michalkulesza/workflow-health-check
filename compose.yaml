services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - workflow_health_check_postgres:/var/lib/postgresql/data

  migrate:
    image: workflow-health-check:${IMAGE_TAG:-local}
    build: .
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-environment
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in the deployment environment}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in the deployment environment}
      REPORT_TOKEN_PEPPER: ${REPORT_TOKEN_PEPPER:?Set REPORT_TOKEN_PEPPER in the deployment environment}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    profiles: ['maintenance']

  web:
    image: workflow-health-check:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    image: workflow-health-check:${IMAGE_TAG:-local}
    command: npm run worker
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    healthcheck:
      test: ['CMD', 'npm', 'run', 'worker:health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the deployment environment}
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
  workflow_health_check_postgres:
