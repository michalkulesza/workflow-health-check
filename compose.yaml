services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.development.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.development.local}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.development.local}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - workflow_health_check_postgres:/var/lib/postgresql/data

volumes:
  workflow_health_check_postgres:
